name: Game tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: node scripts/test-timings.mjs --json test-timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.os }}
          path: |
            test-timings.json
            test-results/
          if-no-files-found: ignore
